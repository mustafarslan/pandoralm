apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pandora-os.fullname" . }}-secrets
  labels:
    {{- include "pandora-os.labels" . | nindent 4 }}
type: Opaque
stringData:
  # In a real chart, these would come from values.yaml (bad) or external-secrets (good).
  # For MVP, we default them or read from values.
  
  # Postgres
  POSTGRES_PASSWORD: "pandora-db-password" # REPLACE IN PROD
  DATABASE_URL: "postgresql://pandora:pandora-db-password@{{ include "pandora-os.fullname" . }}-postgres:5432/pandora"
  
  # Neo4j
  NEO4J_PASSWORD: "pandora-neo4j-password" # REPLACE IN PROD
  NEO4J_AUTH: "neo4j/pandora-neo4j-password"
  
  # MinIO
  MINIO_ROOT_USER: "minioadmin"
  MINIO_ROOT_PASSWORD: "minio-strong-password" # REPLACE IN PROD
  AWS_ACCESS_KEY_ID: "minioadmin"
  AWS_SECRET_ACCESS_KEY: "minio-strong-password"
  
  # OpenAI / LLM Keys
  OPENAI_API_KEY: "sk-..." # Optional
