apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pandora-os.fullname" . }}-cortex
  labels:
    {{- include "pandora-os.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.cortex.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "pandora-os.name" . }}-cortex
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "pandora-os.name" . }}-cortex
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: cortex
          image: "{{ .Values.cortex.image.repository }}:{{ .Values.cortex.image.tag }}"
          imagePullPolicy: {{ .Values.cortex.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "pandora-os.fullname" . }}-config
            - secretRef:
                name: {{ include "pandora-os.fullname" . }}-secrets
          resources:
            {{- toYaml .Values.cortex.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pandora-os.fullname" . }}-cortex
  labels:
    {{- include "pandora-os.labels" . | nindent 4 }}
spec:
  type: {{ .Values.cortex.service.type }}
  ports:
    - port: {{ .Values.cortex.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "pandora-os.name" . }}-cortex
    app.kubernetes.io/instance: {{ .Release.Name }}
