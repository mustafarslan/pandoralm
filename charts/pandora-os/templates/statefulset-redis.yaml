apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "pandora-os.fullname" . }}-redis
  labels:
    {{- include "pandora-os.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "pandora-os.fullname" . }}-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "pandora-os.name" . }}-redis
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "pandora-os.name" . }}-redis
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: redis
          image: "redis:{{ .Values.redis.image.tag }}"
          ports:
            - containerPort: 6379
              name: redis
          command: ["redis-server", "--appendonly", "yes"]
          volumeMounts:
            - name: redis-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: {{ .Values.redis.storage.class }}
        resources:
          requests:
            storage: {{ .Values.redis.storage.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pandora-os.fullname" . }}-redis
  labels:
    {{- include "pandora-os.labels" . | nindent 4 }}
spec:
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    app.kubernetes.io/name: {{ include "pandora-os.name" . }}-redis
    app.kubernetes.io/instance: {{ .Release.Name }}
