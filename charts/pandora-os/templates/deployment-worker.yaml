apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pandora-os.fullname" . }}-worker
  labels:
    {{- include "pandora-os.labels" . | nindent 4 }}
spec:
  replicas: 1 # Controlled by KEDA
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "pandora-os.name" . }}-worker
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "pandora-os.name" . }}-worker
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          # Run both queues for now
          command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info", "-Q", "fast_lane,heavy_lifting,indexing,research", "-c", "2"]
          envFrom:
            - configMapRef:
                name: {{ include "pandora-os.fullname" . }}-config
            - secretRef:
                name: {{ include "pandora-os.fullname" . }}-secrets
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
