apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pandora-os.fullname" . }}-core
  labels:
    {{- include "pandora-os.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.core.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "pandora-os.name" . }}-core
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "pandora-os.name" . }}-core
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: core
          image: "{{ .Values.core.image.repository }}:{{ .Values.core.image.tag }}"
          imagePullPolicy: {{ .Values.core.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "pandora-os.fullname" . }}-config
            - secretRef:
                name: {{ include "pandora-os.fullname" . }}-secrets
          resources:
            {{- toYaml .Values.core.resources | nindent 12 }}
          # Liveness/Readiness probes would go here (e.g., httpGet /)
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pandora-os.fullname" . }}-core
  labels:
    {{- include "pandora-os.labels" . | nindent 4 }}
spec:
  type: {{ .Values.core.service.type }}
  ports:
    - port: {{ .Values.core.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "pandora-os.name" . }}-core
    app.kubernetes.io/instance: {{ .Release.Name }}
