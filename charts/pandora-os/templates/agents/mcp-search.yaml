---
# MCP Search Agent Deployment
# Provides web search capabilities via MCP (Brave Search)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pandora-os.fullname" . }}-mcp-search
  labels:
    {{- include "pandora-os.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-search
    app.kubernetes.io/part-of: pandora-agents
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "pandora-os.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mcp-search
  template:
    metadata:
      labels:
        {{- include "pandora-os.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mcp-search
        app.kubernetes.io/part-of: pandora-agents
    spec:
      containers:
        - name: mcp-bridge
          image: pandora/mcp-bridge:latest
          imagePullPolicy: IfNotPresent
          args: ["uvx", "mcp-server-brave-search"]
          ports:
            - name: sse
              containerPort: 8080
              protocol: TCP
          env:
            - name: BRAVE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "pandora-os.fullname" . }}-secrets
                  key: brave-api-key
          resources:
            limits:
              cpu: 250m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: sse
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: sse
            initialDelaySeconds: 15
            periodSeconds: 30

---
# MCP Search Service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pandora-os.fullname" . }}-mcp-search
  labels:
    {{- include "pandora-os.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-search
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: sse
      protocol: TCP
      name: sse
  selector:
    {{- include "pandora-os.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-search

---
# NetworkPolicy: Allow ingress only from pandora-cortex
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pandora-os.fullname" . }}-mcp-search-policy
  labels:
    {{- include "pandora-os.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-search
spec:
  podSelector:
    matchLabels:
      {{- include "pandora-os.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mcp-search
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: cortex
      ports:
        - protocol: TCP
          port: 8080
