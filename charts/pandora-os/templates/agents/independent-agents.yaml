apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-git
  labels:
    app: mcp-git
    component: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-git
  template:
    metadata:
      labels:
        app: mcp-git
    spec:
      containers:
      - name: mcp-git
        image: mcp-bridge:latest # In prod: your-registry/mcp-bridge:ver
        imagePullPolicy: IfNotPresent
        env:
        - name: MCP_COMMAND
          value: "uvx"
        - name: MCP_ARGS
          value: "mcp-server-git"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-git-service
spec:
  selector:
    app: mcp-git
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-search
  labels:
    app: mcp-search
    component: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-search
  template:
    metadata:
      labels:
        app: mcp-search
    spec:
      containers:
      - name: mcp-search
        image: mcp-bridge:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: MCP_COMMAND
          value: "uvx"
        - name: MCP_ARGS
          value: "mcp-server-brave-search"
        - name: BRAVE_API_KEY
          valueFrom:
            secretKeyRef:
              name: pandora-secrets
              key: brave-api-key
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-search-service
spec:
  selector:
    app: mcp-search
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
