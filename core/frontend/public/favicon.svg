<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect x="4" y="4" width="56" height="56" rx="10" fill="#1B1B1E"/>
  <!-- Neural network nodes -->
  <circle cx="22" cy="22" r="5" fill="url(#grad)"/>
  <circle cx="42" cy="22" r="5" fill="url(#grad)"/>
  <circle cx="32" cy="42" r="5" fill="url(#grad)"/>
  <!-- Neural network connections -->
  <line x1="22" y1="22" x2="42" y2="22" stroke="url(#grad)" stroke-width="2"/>
  <line x1="22" y1="22" x2="32" y2="42" stroke="url(#grad)" stroke-width="2"/>
  <line x1="42" y1="22" x2="32" y2="42" stroke="url(#grad)" stroke-width="2"/>
</svg>
