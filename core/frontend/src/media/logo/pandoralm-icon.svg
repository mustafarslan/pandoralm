<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect x="32" y="32" width="448" height="448" rx="80" fill="#1B1B1E"/>
  <!-- Neural network nodes -->
  <circle cx="180" cy="180" r="32" fill="url(#grad)"/>
  <circle cx="332" cy="180" r="32" fill="url(#grad)"/>
  <circle cx="256" cy="332" r="32" fill="url(#grad)"/>
  <circle cx="180" cy="332" r="24" fill="url(#grad)" opacity="0.7"/>
  <circle cx="332" cy="332" r="24" fill="url(#grad)" opacity="0.7"/>
  <circle cx="256" cy="180" r="24" fill="url(#grad)" opacity="0.7"/>
  <!-- Neural network connections -->
  <line x1="180" y1="180" x2="332" y2="180" stroke="url(#grad)" stroke-width="8" opacity="0.8"/>
  <line x1="180" y1="180" x2="256" y2="332" stroke="url(#grad)" stroke-width="8" opacity="0.8"/>
  <line x1="332" y1="180" x2="256" y2="332" stroke="url(#grad)" stroke-width="8" opacity="0.8"/>
  <line x1="180" y1="332" x2="332" y2="332" stroke="url(#grad)" stroke-width="6" opacity="0.6"/>
  <line x1="256" y1="180" x2="180" y2="332" stroke="url(#grad)" stroke-width="6" opacity="0.6"/>
  <line x1="256" y1="180" x2="332" y2="332" stroke="url(#grad)" stroke-width="6" opacity="0.6"/>
</svg>
