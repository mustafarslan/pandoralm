  <circle cx="25" cy="20" r="3" fill="url(#grad)"/>
  <circle cx="20" cy="30" r="3" fill="url(#grad)"/>
  <line x1="15" y1="20" x2="25" y2="20" stroke="url(#grad)" stroke-width="1.5"/>
  <line x1="15" y1="20" x2="20" y2="30" stroke="url(#grad)" stroke-width="1.5"/>
  <line x1="25" y1="20" x2="20" y2="30" stroke="url(#grad)" stroke-width="1.5"/>
  <!-- Text -->
  <text x="45" y="34" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="600" fill="url(#grad)">PandoraLM</text>
