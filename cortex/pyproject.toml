[tool.poetry]
name = "pandora-cortex"
version = "0.1.0"
description = "Heavy compute engine for PandoraLM - GraphRAG, embeddings, and deep research"
authors = ["PandoraLM Team"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
python-multipart = "^0.0.9"
httpx = "^0.27.0"
sse-starlette = "^2.0.0"
mcp = "^1.9.0"
aiofiles = "^23.2.0"
playwright = "^1.40.0"
semantic-router = "^0.0.20"
trafilatura = "^1.6.0"

# Object Storage
boto3 = "^1.34.0"
minio = "^7.2.0"

# Async & Background Jobs
celery = {extras = ["redis", "pytest"], version = "^5.3.0"}
redis = "^5.0.0"

# Database (Phase 5-3)
asyncpg = "^0.31.0"
alembic = "^1.17.0"

# Vector Database
lancedb = ">=0.11.0,<0.14.0"
pyarrow = "^15.0.0"

# Graph Database
neo4j = "^5.16.0"

# LangChain & Embeddings
langchain = "^0.2.0"
langchain-openai = "^0.1.8"
langchain-community = "^0.2.0"
sentence-transformers = "^2.3.0"

# GraphRAG (Microsoft)
# graphrag = "^0.3.0"

# Document Processing
pymupdf = "^1.23.0"
unidecode = "^1.3.0"
docx2txt = "^0.8"
unstructured = "^0.11.0"
python-slugify = "^8.0.0"
pypdf = "^4.0.0"
python-docx = "^1.1.0"
tiktoken = "^0.7.0"

# Auth
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
GitPython = "^3.1.0"

# Cognitive Router (Intent Classification)

instructor = "^1.0.0"
openai = "^1.0.0"
tree-sitter = "^0.20.0"
tree-sitter-languages = "^1.10.0"
tree-sitter-python = "*"
tree-sitter-javascript = "*"
tree-sitter-typescript = "*"
tree-sitter-go = "*"
tree-sitter-rust = "*"

# Observability
opentelemetry-api = "^1.20.0"
opentelemetry-sdk = "^1.20.0"
opentelemetry-instrumentation-fastapi = "^0.41b0"
opentelemetry-exporter-otlp = "^1.20.0"

# High Performance (Phase 8)
uvloop = "^0.19.0"
onnxruntime = "^1.17.0"
optimum = "^1.17.0"
accelerate = "^0.27.0"  # Required for Optimum

# Memory (Phase 5-2)
mem0ai = "^0.1.0"
numpy = "^1.26.0"

# Optional: Cohere Rerank (Phase 5-2)
cohere = {version = "^4.50", optional = true}


[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^4.1.0"
pytest-archon = "^0.0.4"
ruff = "^0.1.0"
mypy = "^1.8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
